<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>مستند مزوّد الخدمة | OSP</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Plex;src:url(/assets/fonts/plex-arabic-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:Plex;src:url(/assets/fonts/plex-arabic-700.woff2) format("woff2");font-weight:700}
:root{--v:#1c3557;--gold:#d9a441;--line:#e1e4ef;--muted:#5b6475;--ok:#1f9d55;--bad:#d64545;--warn:#e3a008}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:#e9ecf3;font-family:Plex,system-ui,Tahoma,sans-serif;color:#1d2433;font-size:14px;line-height:1.6}
.page{max-width:820px;margin:14px auto;background:#fff;padding:24px 28px 18px;border-radius:10px;box-shadow:0 10px 30px -18px rgba(10,10,60,.4)}
.head{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid var(--v);padding-bottom:10px}
.head img{height:56px}.head b{display:block;font-size:18px;color:var(--v)}.head span{color:var(--gold);font-size:12px}
h1{text-align:center;color:var(--v);font-size:20px;margin:14px 0 0}.sub{text-align:center;color:#b8862f}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.meta div{background:#f4f6f9;border-radius:6px;padding:6px 10px;border-right:3px solid var(--gold)}.meta b{display:block;font-size:11px;color:var(--muted);font-weight:400}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.parties div{border:1px solid var(--line);border-radius:8px;padding:8px 12px}.parties h3{margin:0;color:var(--v);font-size:14px}.parties p{margin:0;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--v);color:#fff;padding:7px;font-weight:700}td{border-bottom:1px solid #e6e9ef;padding:6px;text-align:center}td.r{text-align:right}
tr.bt td{border-top:1.5px solid #c9cfda}
.type{display:inline-block;font-size:11px;border-radius:10px;padding:0 8px;background:#eef1f8;color:var(--v)}.type.damage{background:#fde6e6;color:#9b2222}.type.customer_request{background:#fff3d6;color:#8a5a00}
.tot{margin:10px 0 0 auto;width:300px}.tot div{display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid #e6e9ef}.tot .g{background:var(--v);color:#fff;font-weight:700;border-radius:6px}
h2{font-size:15px;color:var(--v);border-right:4px solid var(--gold);padding-right:8px;margin:16px 0 6px}
.ph{display:flex;gap:8px;flex-wrap:wrap}.ph img{width:140px;height:100px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.foot{margin-top:18px;border-top:1.5px solid var(--v);padding-top:6px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.foot b{color:#0A0A6B}.foot i{color:#57C27F;font-style:normal}
.panel{max-width:820px;margin:12px auto 0;background:#fff;border-radius:10px;padding:14px 16px;border:1px solid var(--line)}
.notes{background:#fff7e6;border:1px solid #f0d28a;border-radius:8px;padding:8px 12px;margin:8px 0}.notes.ok{background:#e8f7ee;border-color:#9fd8b5}.notes.bad{background:#fdecec;border-color:#f3b4b4}
.btn{border:0;border-radius:10px;padding:10px 16px;font:700 14px Plex,sans-serif;cursor:pointer;background:#167A47;color:#fff}.btn.red{background:var(--bad)}.btn.ghost{background:#fff;color:#0A0A6B;border:1px solid var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}textarea,input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:14px Plex,sans-serif;margin-top:6px}
.err{max-width:820px;margin:30px auto;background:#fdecec;border:1px solid #f3b4b4;color:#8a1f1f;border-radius:10px;padding:16px}
@media(max-width:640px){.page{margin:8px;padding:16px}.meta{grid-template-columns:1fr 1fr}.parties{grid-template-columns:1fr}.tot{width:100%}}
@media print{body{background:#fff}.page{box-shadow:none;margin:0;max-width:none;padding:0}.panel,.noprint{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:10mm}}
</style>
</head>
<body>
<div id="panel"></div>
<div id="root"><div class="err" style="background:#fff;border-color:#ddd;color:#555">جاري التحميل…</div></div>
<script>
const API = "https://hscwuuqkizupczcvcacv.supabase.co/functions/v1/vendor";
const q = new URLSearchParams(location.search); const V = q.get("v"), A = q.get("a");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n) => Number(n ?? 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const fD = (d) => d ? new Date(d).toLocaleDateString("ar-SA-u-ca-gregory", { timeZone: "Asia/Riyadh", day: "numeric", month: "numeric", year: "numeric" }) : "—";
const IT = { wear: "صيانة / تلف طبيعي", damage: "ضرر من طرف خارجي", customer_request: "طلب إضافي من العميل" };
async function api(action, extra) { const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, ...extra }) }); const j = await r.json().catch(() => ({ error: "تعذّر الاتصال" })); if (!r.ok) throw new Error(j.error || "خطأ"); return j; }
let D;
async function load() {
  try { D = await api("doc_get", V ? { v: V } : { a: A }); } catch (e) { document.getElementById("root").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  D.type === "quote" ? quote() : invoice();
}
function head() { return `<div class="head"><div>${D.vendor?.logo_url ? `<img src="${esc(D.vendor.logo_url)}" alt="">` : ""}</div><div style="text-align:left"><b>${esc(D.vendor?.name)}</b><span>س.ت ${esc(D.vendor?.cr_number ?? "")} · الرقم الضريبي ${esc(D.vendor?.vat_number ?? "")}</span></div></div>`; }
function foot(ref) { return `<div class="foot"><span>${esc(ref)}</span><span>صادر عبر <b>OSP</b><i>●</i> بوت خدمات اتحاد الملاك · من <b>iDX</b> · idx.sa</span></div>`; }
function parties() { return `<div class="parties"><div><h3>الطرف الأول</h3><p>${esc(D.vendor?.name)}</p><p>س.ت ${esc(D.vendor?.cr_number ?? "")}</p></div><div><h3>الطرف الثاني (العميل)</h3><p>${esc(D.complex?.name)} — إدارة الملاك</p><p>رقم الجمعية ${esc(D.complex?.assoc_number ?? "")} · الرقم الموحد ${esc(D.complex?.unified_number ?? "")}</p></div></div>`; }
function quote() {
  const d = D.doc; const groups = new Map();
  for (const i of D.items) { const k = i.asset?.building ?? "عام"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); }
  let rows = "";
  for (const [k, its] of groups) { const st = its.reduce((s, i) => s + Number(i.line_total), 0);
    its.forEach((i, j) => { rows += `<tr class="${j ? "" : "bt"}">${j ? "" : `<td rowspan="${its.length}"><b>${esc(k)}</b></td>`}<td class="r">${esc(i.description)} <span class="type ${i.item_type}">${IT[i.item_type]}</span>${i.requested_by ? `<br><small style="color:#5b6475">بطلب: ${esc(i.requested_by)}</small>` : ""}</td><td>${Number(i.qty)}</td><td>${money(i.unit_price)}</td><td>${money(i.line_total)}</td>${j ? "" : `<td rowspan="${its.length}" style="background:#fbf6ec"><b>${money(st)}</b></td>`}</tr>`; }); }
  const photos = D.items.filter((i) => i.photo_url);
  document.getElementById("root").innerHTML = `<div class="page">${head()}
  <h1>${d.kind === "contract" ? "عرض سعر عقد صيانة" : "عرض سعر توريد وتركيب قطع غيار"}</h1><div class="sub">${esc(d.title ?? "")} — ${esc(D.complex?.name)}</div>
  <div class="meta"><div><b>رقم العرض</b>${esc(d.ref)}</div><div><b>التاريخ</b>${fD(d.created_at)}</div><div><b>الصلاحية</b>${d.valid_days} يوم</div><div><b>العقد</b>${esc(D.contract?.title ?? "—")}</div></div>
  ${parties()}
  <table><thead><tr><th>المبنى</th><th style="text-align:right">البند</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>إجمالي المبنى</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="tot"><div><span>قبل الضريبة</span><span>${money(d.amount)} ريال</span></div><div><span>الضريبة (15%)</span><span>${money(d.vat_amount)} ريال</span></div><div class="g"><span>الإجمالي شامل الضريبة</span><span>${money(d.total)} ريال</span></div></div>
  ${d.terms?.length ? `<h2>الشروط</h2><ol>${d.terms.map((t) => `<li>${esc(t)}</li>`).join("")}</ol>` : ""}
  ${photos.length ? `<h2>صور الأضرار</h2><div class="ph">${photos.map((i) => `<img src="${esc(i.photo_url)}" alt="${esc(i.description)}">`).join("")}</div>` : ""}
  ${foot(d.ref)}</div>`;
  const st = { submitted: ["بانتظار قرار مدير العقار", ""], approved: ["✅ معتمد", "ok"], rejected: ["❌ مرفوض — " + (d.reject_reason ?? ""), "bad"] }[d.status];
  let p = `<div class="panel noprint"><b>الحالة:</b> ${esc(st[0])}`;
  if ((d.check_notes ?? []).length) p += `<div class="notes"><b>ملاحظات الفحص التلقائي:</b><ul>${d.check_notes.map((n) => `<li><b>${esc(n.item)}:</b> ${esc(n.msg)}</li>`).join("")}</ul></div>`;
  if (D.can_act && d.status === "submitted") p += `<div class="acts"><button class="btn" onclick="qd('approve')">اعتماد العرض</button><button class="btn red" onclick="document.getElementById('rj').hidden=false">رفض</button></div><div id="rj" hidden><textarea id="rr" placeholder="سبب الرفض (يوصل للمنسق)"></textarea><button class="btn red" style="margin-top:6px" onclick="qd('reject')">تأكيد الرفض</button></div>`;
  p += `<div class="acts"><button class="btn ghost" onclick="print()">حفظ PDF / طباعة</button></div><div id="msg"></div></div>`;
  document.getElementById("panel").innerHTML = p;
}
async function qd(dec) { try { await api("quote_decide", { a: A, decision: dec, reason: document.getElementById("rr")?.value }); load(); } catch (e) { document.getElementById("msg").innerHTML = `<div class="notes bad">${esc(e.message)}</div>`; } }
function invoice() {
  const d = D.doc;
  const link = D.installment ? `قسط ${D.installment.seq} من العقد — الفترة ${fD(D.installment.period_start)} إلى ${fD(D.installment.period_end)} — قيمة القسط ${money(D.installment.amount)} ريال` : D.quote ? `عرض السعر ${esc(D.quote.ref_code)} — ${money(D.quote.total)} ريال` : "—";
  document.getElementById("root").innerHTML = `<div class="page">${head()}<h1>فاتورة مزوّد خدمة</h1><div class="sub">${esc(D.complex?.name)}</div>
  <div class="meta"><div><b>رقم الفاتورة</b>${esc(d.invoice_number)}</div><div><b>التاريخ</b>${fD(d.invoice_date)}</div><div><b>الإجمالي</b>${money(d.total)} ريال</div><div><b>الحالة</b>${d.is_paid ? "مدفوعة" : d.decision === "rejected" ? "مرفوضة" : "غير مسددة"}</div></div>
  ${parties()}<table><tr><th style="text-align:right">البيان</th><th>المبلغ</th></tr><tr><td class="r">${esc(d.description ?? "")}<br><small>${link}</small></td><td>${money(d.amount)}</td></tr><tr><td class="r">ضريبة القيمة المضافة</td><td>${money(d.vat_amount)}</td></tr><tr><td class="r"><b>الإجمالي</b></td><td><b>${money(d.total)}</b></td></tr></table>
  ${d.file_url ? `<p class="noprint"><a href="${esc(d.file_url)}" target="_blank">📎 عرض ملف الفاتورة الأصلي</a></p>` : ""}${foot(d.invoice_number ?? "")}</div>`;
  const matched = d.match_status === "matched";
  let p = `<div class="panel noprint"><div class="notes ${matched ? "ok" : ""}"><b>${matched ? "✅ مطابقة تلقائياً" : "⚠️ غير مطابقة"}</b>${(d.match_notes ?? []).length ? "<ul>" + d.match_notes.map((n) => `<li>${esc(n.msg)}</li>`).join("") + "</ul>" : matched ? " — المبلغ والفترة والزيارات والتكرار كلها سليمة." : ""}</div>`;
  if (d.is_paid) p += `<div class="notes ok">💰 مدفوعة ${fD(d.paid_at)}</div>`;
  else if (d.decision === "rejected") p += `<div class="notes bad">مرفوضة: ${esc(d.decision_reason)}</div>`;
  else if (D.can_act) {
    if (matched || d.decision === "approved") p += `<label>مرجع التحويل (اختياري)</label><input id="ref"><div class="acts"><button class="btn" onclick="idc('paid')">تم الدفع</button><button class="btn red" onclick="document.getElementById('rj').hidden=false">رفض</button></div>`;
    else p += `<div class="acts"><button class="btn" onclick="idc('approve')">اعتماد رغم الملاحظات</button><button class="btn red" onclick="document.getElementById('rj').hidden=false">رفض وإرجاع للمنسق</button></div>`;
    p += `<div id="rj" hidden><textarea id="rr" placeholder="سبب الرفض"></textarea><button class="btn red" style="margin-top:6px" onclick="idc('reject')">تأكيد الرفض</button></div>`;
  }
  p += `<div class="acts"><button class="btn ghost" onclick="print()">حفظ PDF / طباعة</button></div><div id="msg"></div></div>`;
  document.getElementById("panel").innerHTML = p;
}
async function idc(dec) { try { await api("invoice_decide", { a: A, decision: dec, reason: document.getElementById("rr")?.value, ref: document.getElementById("ref")?.value }); load(); } catch (e) { document.getElementById("msg").innerHTML = `<div class="notes bad">${esc(e.message)}</div>`; } }
load();
</script>
</body>
</html>
