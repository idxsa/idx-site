<style>
@font-face{font-family:Plex;src:url(/assets/fonts/plex-arabic-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(/assets/fonts/plex-arabic-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Plex;src:url(/assets/fonts/plex-arabic-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--navy:#0A0A6B;--navy2:#1D20B8;--green:#57C27F;--btn:#167A47;--bad:#C93838;--warn:#B7791F;--mist:#F4F6FB;--line:#E3E6F0;--text:#1A1E3C;--muted:#5b6475;--card:#fff;--r:16px}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Plex,system-ui,Tahoma,sans-serif;color:var(--text);background:var(--mist);font-size:15px;line-height:1.6;min-height:100vh}
a{color:var(--btn)}
button{font-family:inherit}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:16px Plex,sans-serif;background:#fff;color:var(--text)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #cdeedb;border-color:var(--btn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 18px;font:600 15px Plex,sans-serif;cursor:pointer;background:var(--btn);color:#fff;text-decoration:none;min-height:44px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.no{background:#fff;color:var(--bad);border:1px solid #f0c4c4}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.wa{background:#25D366;color:#073b1c;width:100%}
.btn.sm{padding:6px 12px;font-size:14px;min-height:40px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:13px}
h1{margin:0;color:var(--navy);font-size:22px;line-height:1.35}
h2{margin:0 0 10px;color:var(--navy);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.err{background:#fdecec;border:1px solid #f3b4b4;color:#8a1f1f;border-radius:12px;padding:10px 12px;margin:10px 0 0;font-size:14px}
.okm{background:#e8f7ee;border:1px solid #9fd8b5;color:#11683a;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.warnline{background:#fff7e6;border:1px solid #f3dca6;color:#7a5200;border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--btn);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#eceff6,#f7f8fb,#eceff6);background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
/* login */
.lg-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 500px at 50% -10%,#1D20B8 0,#0A0A6B 55%,#07074a 100%)}
.lg-brand{color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.lg-brand svg{height:30px}
.login{width:100%;max-width:420px;text-align:center;padding:26px 22px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,30,.35)}
.steps{display:flex;justify-content:center;gap:6px;margin:0 0 16px}
.steps i{width:30px;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--green)}
.code{direction:ltr;font:700 40px/1.1 Plex,monospace;letter-spacing:8px;color:var(--navy);margin:8px 0 14px}
.timer{font-size:12px;color:var(--muted);margin-top:10px}
.waiting{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:var(--muted);font-size:14px}
.otp{direction:ltr;max-width:220px;text-align:center;font:700 32px Plex,monospace;letter-spacing:12px;border:2px solid var(--line);border-radius:14px;padding:10px;margin:6px auto 12px;display:block;color:var(--navy)}
.note{background:#f6f7fc;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:16px;text-align:right}
.alt-l{margin-top:14px;font-size:13px}
.lg-foot{color:rgba(255,255,255,.6);font-size:12px;margin-top:16px}
/* shell */
.shell{display:none}
body.in .shell{display:block}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top .in{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);text-decoration:none}
.brand svg{height:24px;width:auto}
.brand b{display:block;line-height:1.1}.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.who{display:flex;align-items:center;gap:8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.layout{max-width:1180px;margin:auto;padding:16px;display:block}
.side{display:none}
.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabbar button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font:600 11.5px Plex,sans-serif;color:var(--muted);cursor:pointer;border-radius:12px;min-height:54px}
.tabbar button i{font-style:normal;font-size:20px;line-height:1.2}
.tabbar button.on{color:var(--navy);background:#eef1fb}
.nb{position:absolute;top:3px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;font-style:normal;font-size:10.5px;border-radius:10px;padding:0 5px;line-height:16px;font-weight:700}
main{padding-bottom:96px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
.ph p{margin:2px 0 0}
.back{border:1px solid var(--line);background:#fff;border-radius:12px;width:44px;height:44px;font-size:18px;cursor:pointer;color:var(--navy);margin-inline-end:8px}
.ph-t{display:flex;align-items:center}
.refresh{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;cursor:pointer;font:inherit;color:inherit;position:relative;overflow:hidden;min-height:104px}
.kpi:hover{border-color:#c9cfe2}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#eef1fb;margin-bottom:8px}
.kpi b{display:block;font-size:24px;color:var(--navy);line-height:1.15;direction:ltr;unicode-bidi:isolate;text-align:right}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi.hot{background:linear-gradient(135deg,#0A0A6B,#1D20B8);border:0;color:#fff}
.kpi.hot b,.kpi.hot span{color:#fff}.kpi.hot .ic{background:rgba(255,255,255,.15)}
.kpi.bad b{color:var(--bad)}.kpi.good b{color:var(--btn)}
.ring{position:absolute;inset-inline-end:12px;top:12px;width:46px;height:46px}
.bar{height:8px;background:#eef1f8;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--btn);border-radius:8px}
/* queue */
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font:600 13.5px Plex,sans-serif;color:var(--navy);cursor:pointer;white-space:nowrap;min-height:40px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip em{font-style:normal;opacity:.7;margin-inline-start:4px}
.qi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;transition:opacity .3s,transform .3s}
.qi.gone{opacity:0;transform:translateX(-20px)}
.qi .tp{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tag{font-size:12px;font-weight:600;background:#eef1fb;color:var(--navy);border-radius:20px;padding:2px 10px;white-space:nowrap}
.age{font-size:12px;color:var(--muted);white-space:nowrap}
.age.old{color:var(--bad);font-weight:600}
.qi h3{margin:0;font-size:16px;color:var(--text);line-height:1.5}
.qi .mt{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.qi .amt{font-size:22px;font-weight:700;color:var(--navy);margin-top:6px;direction:ltr;text-align:right}
.qi .amt small{font-size:13px;color:var(--muted);font-weight:600}
.qi .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qi .acts .btn{flex:1 1 auto}
.qi .links{display:flex;gap:14px;margin-top:10px;font-size:13px}
.qi .links button,.qi .links a{background:none;border:0;padding:6px 0;color:var(--navy2);font:600 13px Plex,sans-serif;cursor:pointer;text-decoration:none;min-height:32px}
.qi.busy{opacity:.6;pointer-events:none}
.empty{text-align:center;padding:34px 16px}
.empty b{display:block;font-size:40px;margin-bottom:6px}
/* tables/lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.n{background:var(--navy);color:#fff;border-radius:20px;min-width:30px;text-align:center;padding:1px 9px;font-weight:700;font-size:13px}
.list .n{background:var(--navy);color:#fff;border-radius:20px;min-width:30px;text-align:center;padding:1px 9px;font-weight:700;font-size:13px}
.li-btn{width:100%;background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:start;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);min-height:48px}
.li-btn:last-child{border-bottom:0}
.bd{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;background:#eef1f8;color:var(--navy);white-space:nowrap}
.bd.ok{background:#e3f5ea;color:#11683a}.bd.warn{background:#fff3d6;color:#8a5a00}.bd.bad{background:#fde6e6;color:#9b2222}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fafbff}
.tbl .num{direction:ltr;text-align:left;white-space:nowrap}
.tbl small{display:block;color:var(--muted);font-size:12px}
.pos{color:var(--btn)}.neg{color:var(--bad)}
.cards .row-c{display:block;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.row-c .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row-c .r2{font-size:13px;color:var(--muted);margin-top:2px}
.row-c .r3{font-size:14px;margin-top:6px}
.only-d{display:none}.only-m{display:block}
.flt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.flt input{flex:1 1 220px}
/* toggles/prices/options */
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#cfd4e3;border-radius:30px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:24px;height:24px;top:3px;right:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--btn)}
.sw input:checked+span:before{transform:translateX(-22px)}
.sw input:disabled+span{opacity:.45;cursor:default}
.sw input:focus-visible+span{outline:3px solid #cdeedb}
.price{display:flex;gap:8px;align-items:center}
.price input{width:120px;text-align:center;direction:ltr}
.tg{font-size:11px;background:#eef1f8;color:var(--navy);border-radius:10px;padding:1px 8px;margin-inline-start:6px}
.opt{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;gap:8px;background:#fcfcfe}
.opt.off{opacity:.6}
.opt .r{display:flex;align-items:center;gap:8px}
.ic2{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;color:var(--navy);flex:none}
.ic2:disabled{opacity:.3}
.ck{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;min-height:44px}
.ck input{width:20px;height:20px}
.trig{margin-top:6px;font-size:13px;color:var(--btn)}
.desc{margin:6px 0 0;font-size:14px;white-space:pre-wrap}
/* sheet & toast */
.ov{position:fixed;inset:0;background:rgba(10,10,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .x{border:0;background:#eef1f8;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.sheet .row{display:flex;gap:8px;margin-top:12px}.sheet .row .btn{flex:1}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.bot .wt{font-size:15px;line-height:1.75}
.bot .acts2{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bot .rowb{display:block;width:100%;text-align:start;border:1px solid var(--line);background:#fafbfe;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;color:var(--text);min-height:44px}
.bot .rowb b{display:block;color:var(--navy)}.bot .rowb small{display:block;color:var(--muted);font-size:12.5px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1A1E3C;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:50;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:up .2s ease}
.toast.bad{background:var(--bad)}
.banner{background:#fff3d6;color:#7a5200;border-bottom:1px solid #f3dca6;font-size:13.5px;padding:8px 16px;text-align:center}
.banner button{margin-inline-start:8px}
@media(min-width:900px){
  .layout{display:grid;grid-template-columns:230px 1fr;gap:22px;padding:22px 16px}
  .side{display:block;position:sticky;top:76px;align-self:start}
  .side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:start;padding:11px 12px;border-radius:12px;font:600 14.5px Plex,sans-serif;color:var(--muted);cursor:pointer;position:relative;min-height:44px}
  .side button i{font-style:normal;font-size:17px;width:22px;text-align:center}
  .side button.on{background:#fff;color:var(--navy);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
  .side button:hover{color:var(--navy)}
  .side .nb{position:static;margin-inline-start:auto}
  .side hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .tabbar{display:none}
  main{padding-bottom:20px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .only-d{display:block}.only-m{display:none}
  table.only-d{display:table}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cols>.card{margin-bottom:0}
  .ov{align-items:center}.sheet{border-radius:20px}
  .toast{bottom:28px}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qgrid .qi{margin-bottom:0}
}
</style>
</head>

      tbn.addEventListener("click", function () { tbn.disabled = true; api("set_price", { key: "custody_low_alert", value: Number(digits(th.value)) }).then(function () { tbn.disabled = false; toast("✅ تم الحفظ"); delete C.custody; }).catch(function (e) { tbn.disabled = false; toast(e.message, true); }); });

  function services() {
    view("list", "list", null, function (ls) {

        sv.appendChild(el("li", {}, [el("span", {}, [(s.icon ? s.icon + " " : "") + s.name_ar, s.built ? null : el("span", { class: "tg", text: "قيد التطوير" })]), el("label", { class: "sw" }, [cb, el("span")])]));

      var pl = el("ul", { class: "list" });

  var SCOPE = { unit: "داخل الوحدة", common: "مناطق مشتركة", any: "الكل" };
  var ICAT = null, IDIRTY = 0;
  function issues() {
    IDIRTY = 0;
    view("issues", "issues", null, function (r) {
      if (IDIRTY) return;
      clear(app);
      app.appendChild(head("الخيارات الجاهزة", "اللي يشوفه الساكن والمشرف لما يبلّغ. الحد 8 خيارات لكل بند، و«أخرى» تنضاف تلقائياً.", "more"));
      var cats = []; r.options.forEach(function (o) { if (cats.indexOf(o.cat) < 0) cats.push(o.cat); });
      if (!ICAT || cats.indexOf(ICAT) < 0) ICAT = cats[0];
      var chips = el("div", { class: "chips" });
      cats.forEach(function (c) { chips.appendChild(el("button", { class: "chip" + (c === ICAT ? " on" : ""), type: "button", text: c, on: { click: function () { if (IDIRTY && !confirm("فيه تعديلات ما انحفظت. تتركها؟")) return; ICAT = c; IDIRTY = 0; issues(); } } })); });
      app.appendChild(chips);
      var groups = {};
      r.options.filter(function (o) { return o.cat === ICAT; }).forEach(function (o) { var k = o.scope + "|" + (o.sub || ""); (groups[k] = groups[k] || []).push(o); });
      Object.keys(groups).forEach(function (k) {
        var parts = k.split("|"), sub = parts[1];
        var subL = sub ? ((r.subs.filter(function (s) { return s.cat === ICAT && s.key === sub; })[0] || {}).label || sub) : "";
        var act = groups[k].filter(function (o) { return o.active; }).length;
        var g = card([el("div", { class: "ph", style: "margin:0 0 10px" }, [el("h2", { text: SCOPE[parts[0]] + (subL ? " · " + subL : ""), style: "margin:0" }), el("span", { class: "bd" + (act >= 8 ? " warn" : ""), text: act + " / 8 ظاهر" })])]);
        groups[k].forEach(function (o, i) { g.appendChild(optRow(o, i, groups[k].length)); });
        g.appendChild(addRow(ICAT, parts[0], sub));
        app.appendChild(g);
      });
    });
  }
  function optRow(o, i, n) {
    var lab = el("input", { type: "text", value: o.label, maxlength: "24", "aria-label": "نص الخيار" });
    var hint = el("input", { type: "text", value: o.hint || "", maxlength: "72", placeholder: "شرح قصير (اختياري)", "aria-label": "الشرح" });
    var urg = el("input", { type: "checkbox" }); urg.checked = !!o.urgent;
    var actv = el("input", { type: "checkbox" }); actv.checked = !!o.active;
    var save = el("button", { class: "btn sm", type: "button", text: "حفظ", disabled: true });
    var wasDirty = false;
    function dirty() {
      var d = !(lab.value.trim() === o.label && hint.value.trim() === (o.hint || "") && urg.checked === !!o.urgent && actv.checked === !!o.active);
      if (d !== wasDirty) { IDIRTY += d ? 1 : -1; wasDirty = d; } save.disabled = !d;
    }
    [lab, hint].forEach(function (x) { x.addEventListener("input", dirty); }); [urg, actv].forEach(function (x) { x.addEventListener("change", dirty); });
    save.addEventListener("click", function () {
      save.disabled = true;
      api("issue_save", { id: o.id, label: lab.value, hint: hint.value, urgent: urg.checked, active: actv.checked }).then(function (r) { Object.assign(o, r.option); dirty(); delete C.issues; toast("✅ تم الحفظ — يظهر في البوت فوراً"); })
        .catch(function (e) { dirty(); toast(e.message, true); });
    });
    var moving = false;
    function mv(dir) { if (moving) return; if (IDIRTY && !confirm("فيه تعديلات ما انحفظت. تتركها؟")) return; moving = true; api("issue_move", { id: o.id, dir: dir }).then(function () { delete C.issues; IDIRTY = 0; issues(); }).catch(function (e) { moving = false; toast(e.message, true); }); }
    return el("div", { class: "opt" + (o.active ? "" : " off") }, [
      el("div", { class: "r" }, [lab,
        el("button", { type: "button", class: "ic2", "aria-label": "لفوق", text: "▲", disabled: i === 0, on: { click: function () { mv("up"); } } }),
        el("button", { type: "button", class: "ic2", "aria-label": "لتحت", text: "▼", disabled: i === n - 1, on: { click: function () { mv("down"); } } })]),
      hint,
      el("div", { class: "r", style: "justify-content:space-between" }, [el("label", { class: "ck" }, [actv, " ظاهر"]), el("label", { class: "ck" }, [urg, " 🔴 عاجل"]), save])
    ]);
  }
  function addRow(cat, scope, sub) {
    var lab = el("input", { type: "text", maxlength: "24", placeholder: "➕ خيار جديد", "aria-label": "خيار جديد" });
    var b = el("button", { class: "btn ghost sm", type: "button", text: "إضافة" });
    b.addEventListener("click", function () {
      if (!lab.value.trim()) return lab.focus();
      b.disabled = true;
      api("issue_save", { cat: cat, scope: scope, sub: sub || null, label: lab.value }).then(function () { delete C.issues; IDIRTY = 0; issues(); toast("✅ انضاف"); }).catch(function (e) { b.disabled = false; toast(e.message, true); });
    });
    return el("div", { class: "opt r", style: "display:flex;background:none;border-style:dashed" }, [lab, b]);
  }

  var AUD = { web_login: "دخل اللوحة", enable: "شغّل خدمة", disable: "أوقف خدمة", edit_price: "عدّل سعر", approve: "اعتمد", reject: "رفض", edit: "عدّل", create: "أضاف", reorder: "رتّب", delete: "حذف", cancel: "ألغى", close: "أقفل" };
  var ENT = { dashboard_sessions: "لوحة التحكم", services: "الخدمات", settings: "الإعدادات", setting: "الإعدادات", issue_options: "الخيارات الجاهزة", purchase: "طلب شراء", registration: "تسجيل", payment: "دفعة", maintenance_requests: "بلاغ", notice: "إشعار", custody: "العهدة", work_order: "أمر عمل", remote: "ريموت", renovation: "ترميم" };
  function audit() {

  var BL = { parked: ["مؤجلة", ""], ready: ["جاهزة", "warn"], planned: ["مخططة", "warn"], in_progress: ["قيد التنفيذ", "warn"], done: ["منجزة", "ok"], dropped: ["ملغاة", "bad"] };

      });
      app.appendChild(g);
    });
  }

  boot();
})();
