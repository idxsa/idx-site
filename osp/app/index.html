:root{--navy:#0A0A6B;--green:#57C27F;--btn:#167A47;--bad:#d64545;--mist:#F3F5FA;--line:#E1E4EF;--text:#1A1E3C;--muted:#5b6475}

*{box-sizing:border-box}

.hd{max-width:960px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);text-decoration:none}
.brand svg{height:26px;width:auto}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.brand b{display:block;line-height:1.2}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1{margin:0 0 4px;color:var(--navy);font-size:22px}

.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:600 15px Plex,sans-serif;cursor:pointer;background:var(--btn);color:#fff;text-decoration:none;min-height:46px}
.btn.wa{background:#25D366;color:#073b1c;width:100%}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:36px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.login{max-width:440px;margin:24px auto;text-align:center;padding:24px 20px}
.steps{display:flex;justify-content:center;gap:6px;margin:4px 0 18px}
.steps i{width:28px;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--green)}
.code{direction:ltr;font:700 40px/1.1 Plex,monospace;letter-spacing:8px;color:var(--navy);margin:8px 0 14px}
.timer{font-size:12px;color:var(--muted);margin-top:10px}
.waiting{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--btn);border-radius:50%;animation:sp 1s linear infinite}

.otp:focus{outline:none;border-color:var(--btn)}
.err{background:#fdecec;border:1px solid #f3b4b4;color:#8a1f1f;border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:14px}
.okm{background:#e8f7ee;border:1px solid #9fd8b5;color:#11683a;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.note{background:#f6f7fc;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:16px;text-align:right}
.alt{margin-top:14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font-size:28px;color:var(--navy);line-height:1.2}

.list{list-style:none;margin:0;padding:0}

.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cfd4e3;border-radius:28px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;top:3px;right:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--btn)}
.sw input:checked+span:before{transform:translateX(-20px)}

.foot{text-align:center;color:var(--muted);font-size:12px;padding:18px}

.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#eef0f6,#f7f8fb,#eef0f6);background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
input[type=text],input[type=search],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:15px Plex,sans-serif;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid #b9e3c9;border-color:var(--btn)}
.ph{display:flex;align-items:flex-start;gap:10px;margin:4px 2px 12px}
.back{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none;color:var(--navy)}

.tabbar button i{font-style:normal;font-size:19px;line-height:1.2}
.tabbar button.on{color:var(--navy);background:#eef1f8}
.nb{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;font-style:normal;font-size:10.5px;border-radius:10px;padding:0 5px;line-height:16px}

.bar{height:10px;background:#eef1f8;border-radius:10px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--btn)}
.tbl .tr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.num{text-align:left;direction:ltr}.num small{text-align:left}
.pos{color:var(--btn)}.neg{color:var(--bad)}.warnt{color:#8a5a00!important}
.flt{display:grid;gap:10px}
.lbl{font-size:13px;color:var(--muted)}
.bot .me{align-self:flex-end;background:#e3f5ea;color:#11683a;border-radius:14px;padding:6px 12px;font-size:13px;margin:0 0 10px auto;width:fit-content;max-width:85%}
.bot{display:flex;flex-direction:column}
.msg .wt{font-size:15px;line-height:1.75;white-space:normal}
.msg h3{margin:0 0 6px;color:var(--navy)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acts .btn{width:100%}
.btn.danger{color:var(--bad);border-color:#f3b4b4}
.row-btn{display:block;width:100%;text-align:start;border:1px solid var(--line);background:#fafbfe;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;color:var(--text)}
.row-btn:hover{border-color:var(--btn)}
.row-btn b{display:block;color:var(--navy);font-size:15px}.row-btn small{display:block;color:var(--muted);font-size:12.5px}
.sec{font-size:12px;color:var(--muted);margin-top:6px}
.composer .row{gap:8px}.composer .chips{margin:10px 0 0}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;gap:8px;background:#fcfcfe}
.opt.off{opacity:.6}
.mv{display:flex;gap:4px;flex:none}
.ic{width:36px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--navy)}

.ck{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px}
.addr{margin-top:6px}.addr .btn{flex:none}
@media(min-width:760px){.tabbar{position:sticky;top:57px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:4px}
.tabbar button{flex-direction:row;gap:6px;font-size:14px;min-height:40px;padding:6px 14px}.tabbar button i{font-size:16px}.nb{position:static;margin-inline-start:4px}
body.in main{padding-bottom:16px}.kpis{grid-template-columns:repeat(4,1fr)}}

<script>
(function () {
  var API = "https://hscwuuqkizupczcvcacv.supabase.co/functions/v1/dashboard";
  var BOT = "966565020464";
  var TK = "osp_dash_token", LK = "osp_dash_login";
  var app = document.getElementById("app"), hdu = document.getElementById("hdu");
  var TOKEN = null, pollT = null, tickT = null, L = null;

  function store(k, v, sess) { try { var s = sess ? sessionStorage : localStorage; v == null ? s.removeItem(k) : s.setItem(k, JSON.stringify(v)); } catch (e) {} }

    return fetch(API, { method: "POST", headers: h, body: JSON.stringify(body) }).then(function (r) {

        if (!r.ok) { var e = new Error(j.error || "صار خطأ، جرّب مرة ثانية"); e.data = j; throw e; }

    }, function () { throw new Error("تعذّر الاتصال، تأكد من الإنترنت"); });
  }

    TOKEN = t;
    store(TK, t ? { t: t, exp: exp } : null);
  }
  var tz = { timeZone: "Asia/Riyadh" };
  function fTime(d) { return new Date(d).toLocaleString("ar-SA-u-ca-gregory-nu-latn", Object.assign({ weekday: "long", hour: "numeric", minute: "2-digit" }, tz)); }
  function stopTimers() { clearTimeout(pollT); clearInterval(tickT); pollT = tickT = null; }

  // ================= الدخول =================
  function loginScreen() {
    stopTimers(); hdu.hidden = true; document.body.classList.remove("in"); if (nav) nav.hidden = true; clear(app);
    var saved = load(LK, true);
    if (saved && new Date(saved.expires_at) > new Date()) { L = saved; return saved.step === "confirm" ? confirmStep() : sendStep(); }
    var c = el("div", { class: "card login" }, [
      el("h1", { text: "دخول OSP" }),
      el("p", { class: "muted", text: "ادخل برقم جوالك المسجّل في OSP. النظام يعرف صلاحيتك تلقائياً." }),
      el("button", { class: "btn", type: "button", style: "width:100%;margin-top:10px", text: "🔐 تسجيل الدخول", on: { click: start } }),
      el("div", { id: "lgm" }),
      el("div", { class: "note" }, ["الدخول بخطوتين: ترسل رمزاً للبوت من واتساب جوالك، ثم تكتب رمز التأكيد اللي يرجع لك. الجلسة صالحة يوماً واحداً من وقت الدخول."]),
      el("p", { class: "alt" }, ["مزوّد خدمة؟ ", el("a", { href: "/osp/vendor/", text: "ادخل من بوابة المزوّدين" })])
    ]);
    app.appendChild(c);
  }
  function start(ev) {
    var b = ev && ev.target; if (b) b.disabled = true;
    api("start").then(function (s) {
      L = { sid: s.sid, nonce: s.nonce, code: s.code, expires_at: s.expires_at, step: "send" };
      store(LK, L, true); sendStep();
    }).catch(function (e) { if (b) b.disabled = false; showErr("lgm", e.message); });
  }
  function showErr(id, msg) { var m = document.getElementById(id); if (m) { clear(m); m.appendChild(el("div", { class: "err", text: msg })); } }
  function restart() { store(LK, null, true); L = null; loginScreen(); }
  function countdown(node) {
    function t() {
      var s = Math.max(0, Math.round((new Date(L.expires_at) - new Date()) / 1000));

  }
  function expired() {

    app.appendChild(el("div", { class: "card login" }, [
      el("h1", { text: "انتهت صلاحية الرمز" }),

    var tm = el("div", { class: "timer" });

      el("div", { class: "steps" }, [el("i", { class: "on" }), el("i")]),
      el("h1", { text: "أرسل الرمز للبوت" }),
      el("p", { class: "muted", text: "من واتساب جوالك المسجّل:" }),
      el("div", { class: "code", text: L.code }),

        store(LK, null, true); L = null; setToken(r.token, r.expires_at); boot();
      }).catch(function (e) {
        btn.disabled = false; inp.value = ""; inp.focus();
        if (e.data && e.data.restart) { store(LK, null, true); return expired(); }
        showErr("cfm", e.message + (e.data && e.data.left != null ? " — باقي " + e.data.left + " محاولات" : ""));
      });
    }

    inp.addEventListener("input", function () { if (inp.value.replace(/\D/g, "").length === 4) go(); });

          el("div", {}, [el("b", { text: t ? "➕ تحويل" : "➖ " + ((e.purchase_requests && e.purchase_requests.ref_code) || "صرف") }), el("small", { text: (e.purchase_requests && e.purchase_requests.description) || e.note || "" })]),
          el("div", { class: "num" }, [el("b", { class: t ? "pos" : "neg", text: (t ? "+" : "−") + money(e.amount) }), el("small", { text: fDay(e.created_at) })]),
          e.status === "pending" ? badge(["بانتظار التأكيد", "warn"]) : el("span")
        ]));
      });
      app.appendChild(box);
    }).catch(function (e) { if (TOKEN) fail(e, custody); });
  }

  // ---------- الخدمات والأسعار
  function services() {
    loading();
    api("list").then(function (ls) {
      clear(app);
      app.appendChild(head("الخدمات والأسعار", null, "more"));
      var sv = el("ul", { class: "list" });
      var sc = card([el("h2", { text: "الخدمات" }), el("p", { class: "muted", style: "margin-top:-6px", text: "الخدمة الموقوفة تظهر للسكان «متوقفة»." }), sv]);
      (ls.services || []).forEach(function (s) {
        var cb = el("input", { type: "checkbox", "aria-label": s.name_ar });
        cb.checked = !!s.enabled; if (!s.built) cb.disabled = true;
        cb.addEventListener("change", function () {
          var want = cb.checked; cb.disabled = true;
          api("toggle", { key: s.key, enabled: want }).then(function () { s.enabled = want; cb.disabled = false; flash(sc, (want ? "✅ تم تشغيل " : "⏸️ تم إيقاف ") + s.name_ar); })
            .catch(function (e) { cb.checked = !want; cb.disabled = false; flash(sc, e.message, true); });
        });
        sv.appendChild(el("li", {}, [el("span", {}, [(s.icon ? s.icon + " " : "") + s.name_ar, s.built ? null : el("span", { class: "tag", text: "قيد التطوير" })]), el("label", { class: "sw" }, [cb, el("span")])]));
      });
      var pl = el("ul", { class: "list" });
      var pc = card([el("h2", { text: "الأسعار (ريال)" }), pl]);
      (ls.prices || []).forEach(function (p) {
        var inp = el("input", { type: "number", inputmode: "decimal", min: "1", value: String(p.value), "aria-label": p.label });
        var b = el("button", { class: "btn sm", type: "button", text: "حفظ" }); b.disabled = true;
        inp.addEventListener("input", function () { b.disabled = Number(inp.value) === p.value || !(Number(inp.value) > 0); });
        b.addEventListener("click", function () {
          b.disabled = true;
          api("set_price", { key: p.key, value: Number(inp.value) }).then(function (r) { p.value = r.value; flash(pc, "✅ تم حفظ " + p.label); })
            .catch(function (e) { b.disabled = false; flash(pc, e.message, true); });
        });
        pl.appendChild(el("li", {}, [el("span", { text: p.label }), el("span", { class: "price" }, [inp, b])]));
      });
      app.appendChild(el("div", { class: "cols" }, [sc, pc]));
    }).catch(function (e) { if (TOKEN) fail(e, services); });
  }

  // ---------- الخيارات الجاهزة
  var ICAT = null;
  function issues() {
    loading();
    api("issues").then(function (r) {
      clear(app);
      app.appendChild(head("الخيارات الجاهزة", "اللي يشوفه الساكن والمشرف لما يبلّغ. الحد 8 خيارات لكل بند، و«أخرى» تنضاف تلقائياً.", "more"));
      var cats = [];
      r.options.forEach(function (o) { if (cats.indexOf(o.cat) < 0) cats.push(o.cat); });
      if (!ICAT || cats.indexOf(ICAT) < 0) ICAT = cats[0];
      var sel = el("select", { "aria-label": "البند" });
      cats.forEach(function (c) { var o = el("option", { value: c, text: c }); if (c === ICAT) o.selected = true; sel.appendChild(o); });
      sel.addEventListener("change", function () { ICAT = sel.value; issues(); });
      app.appendChild(card([el("label", { class: "lbl", text: "البند" }), sel], "flt"));
      var groups = {};
      r.options.filter(function (o) { return o.cat === ICAT; }).forEach(function (o) { var k = o.scope + "|" + (o.sub || ""); (groups[k] = groups[k] || []).push(o); });
      Object.keys(groups).forEach(function (k) {
        var parts = k.split("|"), sub = parts[1];
        var subL = sub ? ((r.subs.filter(function (s) { return s.cat === ICAT && s.key === sub; })[0] || {}).label || sub) : "";
        var g = card([el("h2", { text: SCOPE[parts[0]] + (subL ? " · " + subL : "") })]);
        var ul = el("div", {});
        groups[k].forEach(function (o, i) { ul.appendChild(optRow(o, i, groups[k].length, g)); });
        g.appendChild(ul);
        g.appendChild(addRow(ICAT, parts[0], sub, g));
        app.appendChild(g);
      });
    }).catch(function (e) { if (TOKEN) fail(e, issues); });
  }
  function optRow(o, i, n, g) {
    var lab = el("input", { type: "text", value: o.label, maxlength: "24", "aria-label": "نص الخيار" });
    var hint = el("input", { type: "text", value: o.hint || "", maxlength: "72", placeholder: "شرح قصير (اختياري)", "aria-label": "الشرح" });
    var urg = el("input", { type: "checkbox" }); urg.checked = !!o.urgent;
    var act = el("input", { type: "checkbox" }); act.checked = !!o.active;
    var save = el("button", { class: "btn sm", type: "button", text: "حفظ" }); save.disabled = true;
    function dirty() { save.disabled = lab.value.trim() === o.label && hint.value.trim() === (o.hint || "") && urg.checked === !!o.urgent && act.checked === !!o.active; }
    [lab, hint].forEach(function (x) { x.addEventListener("input", dirty); }); [urg, act].forEach(function (x) { x.addEventListener("change", dirty); });
    save.addEventListener("click", function () {
      save.disabled = true;
      api("issue_save", { id: o.id, label: lab.value, hint: hint.value, urgent: urg.checked, active: act.checked }).then(function (r) { Object.assign(o, r.option); dirty(); flash(g, "✅ تم الحفظ"); })
        .catch(function (e) { dirty(); flash(g, e.message, true); });
    });
    function mv(dir) { api("issue_move", { id: o.id, dir: dir }).then(issues).catch(function (e) { flash(g, e.message, true); }); }
    return el("div", { class: "opt" + (o.active ? "" : " off") }, [
      el("div", { class: "row" }, [lab, el("span", { class: "mv" }, [
        el("button", { type: "button", class: "ic", "aria-label": "لفوق", text: "▲", disabled: i === 0 ? "" : null, on: { click: function () { mv("up"); } } }),
        el("button", { type: "button", class: "ic", "aria-label": "لتحت", text: "▼", disabled: i === n - 1 ? "" : null, on: { click: function () { mv("down"); } } })
      ])]),
      hint,
      el("div", { class: "row" }, [el("label", { class: "ck" }, [act, " ظاهر"]), el("label", { class: "ck" }, [urg, " 🔴 عاجل"]), save])
    ]);
  }
  function addRow(cat, scope, sub, g) {
    var lab = el("input", { type: "text", maxlength: "24", placeholder: "➕ خيار جديد", "aria-label": "خيار جديد" });
    var b = el("button", { class: "btn ghost sm", type: "button", text: "إضافة" });
    b.addEventListener("click", function () {
      if (!lab.value.trim()) return lab.focus();
      b.disabled = true;
      api("issue_save", { cat: cat, scope: scope, sub: sub || null, label: lab.value }).then(issues).catch(function (e) { b.disabled = false; flash(g, e.message, true); });
    });
    return el("div", { class: "row addr" }, [lab, b]);
  }

  // ---------- السجل
  function audit() {
    loading();
    api("audit").then(function (r) {
      clear(app);
      app.appendChild(head("سجل التعديلات", "آخر 80 عملية", "more"));
      var box = el("div", { class: "card tbl" });
      r.rows.forEach(function (x) {
        box.appendChild(el("div", { class: "tr" }, [
          el("div", {}, [el("b", { text: x.who + " · " + x.action }), el("small", { text: x.entity + (x.note ? " — " + x.note : "") })]),
          el("div", { class: "num" }, [el("small", { text: fDT(x.created_at) })])
        ]));
      });
      app.appendChild(box);
    }).catch(function (e) { if (TOKEN) fail(e, audit); });
  }

  // ---------- خارطة الطريق
  function roadmap() {
    loading();
    api("roadmap").then(function (r) {
      clear(app);
      app.appendChild(head("خارطة الطريق", "أفكار مؤجلة مع الشرط اللي يرجّعها", "more"));
      r.rows.forEach(function (x) {
        app.appendChild(card([
          el("div", { class: "row" }, [el("b", { text: x.title }), badge(BL[x.status] || [x.status, ""])]),
          x.area ? el("div", { class: "muted", text: x.area }) : null,
          x.details ? el("p", { class: "desc", text: x.details }) : null,
          x.why_not_now ? el("div", { class: "muted", text: "ليش مو الحين: " + x.why_not_now }) : null,
          x.trigger_condition ? el("div", { class: "trig", text: "🔔 نرجع لها: " + x.trigger_condition }) : null
        ]));
      });
    }).catch(function (e) { if (TOKEN) fail(e, roadmap); });
  }

  document.getElementById("out").addEventListener("click", function () {
    api("logout").catch(function () {}).then(function () { setToken(null); loginScreen(); });
  });
  boot();
})();
</script>
